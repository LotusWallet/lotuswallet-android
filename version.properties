# ============================================================================
# LotusWallet 版本号 —— 全仓库唯一来源
# ============================================================================
#
# 为什么要有这个文件：
#   一次发布，版本号会出现在至少四个地方 ——
#     · APK 的 versionName / versionCode（用户与系统看到的那两个数）
#     · git tag（v3.0.1）
#     · LotusWallet/download 仓库里的 versions.json（客户端拿它判断有没有新版）
#     · CHANGELOG 标题
#   四处手改，迟早漂。所以这里定义一次，其余全部由脚本派生：
#     app/build.gradle.kts 读本文件   → versionName / versionCode
#     tools/bump_version.py 改本文件   → 同时打 tag、写 CHANGELOG、写 versions.json
#
# ⚠️ 每次改动（无论大小：改文案、修 bug、加功能）都要升级版本号。
#    升级请用 `python tools/bump_version.py --part patch|minor|major`，不要手改本文件。
#
# 版本号规则
# ----------
#   版本号起点是 3.0.1：上一代 Android 客户端最后到过 2.5.2，本次是完全重写，
#   直接跳大版本。3.x 与 2.x 之间没有兼容性承诺（签名、包名、数据都不延续）。
#
#   versionName  = "<major>.<minor>.<patch>" [+ "-beta.<pre>"]
#   versionCode  = major * 10000 + minor * 100 + patch
#                   3.0.1  →  30001
#                   2.5.2  →  20502   （旧版最大版本号，确实小于 30001）
#                   3.1.0  →  30100
#   minor 与 patch 各限 0–99；超出请向高位进一（bump 脚本会拦下超限的情况）。
#   位宽固定，所以 versionCode 一定随版本单调递增 —— 这是系统判断「能否覆盖安装」的依据。
#
# 预发布
# ------
#   version.pre > 0 时 versionName 会带 -beta.N 后缀，仅用于内测分发。
#   ⚠️ pre 不参与 versionCode：对外发布的每个版本必须靠 patch 递增来区分。
#      灰度发过 3.0.2-beta.1 之后，正式版要发 3.0.3，不能再发 3.0.2。
#
# ============================================================================

version.major=3
version.minor=0
version.patch=3
version.pre=0