# Gradle
# 注意：本机 C 盘空间紧张、提交内存有限，因此
#   1) 堆上限压到 3g，避免 JVM 因「页面文件太小」直接崩溃；
#   2) 关闭并行任务，防止多个重任务同时申请大块内存；
#   3) 所有临时目录（Gradle / Kotlin 守护进程 / KSP）统一定向到 D 盘。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/tmp
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin 守护进程同样把临时目录放到 D 盘
kotlin.daemon.jvmargs=-Xmx2048m -Djava.io.tmpdir=D:/tmp

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
