# Gradle
# 注意：本机 C 盘空间紧张、提交内存有限，因此
#   1) 堆上限压到 3g，避免 JVM 因「页面文件太小」直接崩溃；
#   2) 关闭并行任务，防止多个重任务同时申请大块内存。
#
# 这里**不能**出现机器专属的绝对路径（例如 -Djava.io.tmpdir=D:/tmp）。
# 曾经写过，后果很具体：任何没有 D 盘的环境都起不来 Gradle 守护进程，
# 报的是看不懂的
#   Cannot create service of type ValueSnapshotter ...
# 而不是「找不到 D:/tmp」。本机的临时目录重定向由 tools/build.sh 通过
# TMPDIR / _JAVA_OPTIONS 环境变量完成，或写进 $GRADLE_USER_HOME/gradle.properties
# （本机为 D:\gradle-home\gradle.properties），不要把机器状态提交进仓库。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin 守护进程
kotlin.daemon.jvmargs=-Xmx2048m

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
